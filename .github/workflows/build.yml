name: build

# This workflow builds and tests the project on pushes and PRs to main.
on:
  push:
    branches: ["main"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
