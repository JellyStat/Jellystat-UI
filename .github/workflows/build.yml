name: build

# This workflow builds and tests the project on pushes and PRs to main.
on:
  push:
    branches: ["main"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package build artifact
        run: |
          set -e
          rm -f jellystat-ui-build.zip
          mkdir -p artifact
          if [ -d out ]; then cp -r out artifact/ || true; fi
          if [ -d .next ]; then cp -r .next artifact/ || true; fi
          cp -r public artifact/ || true
          zip -r jellystat-ui-build.zip artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellystat-ui-build
          path: jellystat-ui-build.zip
