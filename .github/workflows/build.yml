name: Build and Release UI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.1"
          cache: "npm"

      # Extract version from package.json and short SHA from Git
      - name: Set Version Environment Variables
        id: vars
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="jellystat-ui-v${PACKAGE_VERSION}-${SHORT_SHA}"

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Install and Build UI
        run: |
          npm ci
          npm run build

      # Create empty tag file
      - name: Create Empty Tag File
        run: |
          cd out && touch ${{ env.SHORT_SHA }}.emtag

      # Zip the output using your dynamic tag name
      - name: Zip Build Output
        run: |
          cd out && zip -r ../${{ env.TAG_NAME }}.zip .

      # --- NEW STEPS START HERE ---

      - name: Generate Release JSON Info
        run: |
          ZIP_FILE="${{ env.TAG_NAME }}.zip"

          # Calculate the SHA-256 hash
          ZIP_HASH=$(sha256sum $ZIP_FILE | awk '{ print $1 }')

          # Construct the release link automatically handling your Jellystat org and repo name
          REPO="${{ github.repository }}"
          RELEASE_LINK="https://github.com/$REPO/releases/download/${{ env.TAG_NAME }}/$ZIP_FILE"

          # Build the JSON file
          jq -n \
            --arg id "${{ env.SHORT_SHA }}" \
            --arg hash "$ZIP_HASH" \
            --arg link "$RELEASE_LINK" \
            '{id: $id, hash: $hash, link: $link}' > release.json

      - name: Commit and Push JSON
        run: |
          # Set up git author as the GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release.json

          # Commit with [skip ci] to prevent infinite workflow loops
          git commit -m "chore: update release info for ${{ env.TAG_NAME }} [skip ci]"

          # Push specifically to main
          git push origin HEAD:main

      # --- NEW STEPS END HERE ---

      # Create a dedicated GitHub Release named after the version + SHA string
      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: UI Build ${{ env.TAG_NAME }}
          files: ${{ env.TAG_NAME }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
